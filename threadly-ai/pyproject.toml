[project]
name = "threadly-ai"
version = "0.1.0"
description = "Threadly AI sidecar — LLM + RAG"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.31.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "anthropic>=0.37.0",
  "openai>=1.52.0",
  "langchain-text-splitters>=0.3.0",
  "qdrant-client>=1.12.0",
  "boto3>=1.35.0",
  "unstructured[pdf]>=0.16.0",
  "pypdf>=5.1.0",
  "langfuse>=2.53.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
