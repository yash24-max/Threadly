name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # threadly-core (Spring Boot / Java 21)
  # ─────────────────────────────────────────────
  core:
    name: Core (Java 21)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: threadly_test
          POSTGRES_USER: threadly
          POSTGRES_PASSWORD: threadly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: threadly-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Format check (Spotless)
        run: ./mvnw spotless:check -q

      - name: Build + test
        run: ./mvnw verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/threadly_test
          SPRING_DATASOURCE_USERNAME: threadly
          SPRING_DATASOURCE_PASSWORD: threadly
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-surefire-reports
          path: threadly-core/target/surefire-reports/

  # ─────────────────────────────────────────────
  # threadly-ai (Python 3.12 / FastAPI)
  # ─────────────────────────────────────────────
  ai:
    name: AI sidecar (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: threadly-ai

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app --strict --ignore-missing-imports

      - name: Tests
        run: pytest -q

  # ─────────────────────────────────────────────
  # threadly-web (Next.js 15 / Node 20)
  # ─────────────────────────────────────────────
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: threadly-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: threadly-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npx biome check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_CENTRIFUGO_URL: ws://localhost:8000/connection/websocket

  # ─────────────────────────────────────────────
  # threadly-widget (Preact / Vite)
  # ─────────────────────────────────────────────
  widget:
    name: Widget (Preact)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: threadly-widget

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: threadly-widget/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: |
          BUNDLE_SIZE=$(du -sk dist/widget.js 2>/dev/null | cut -f1 || echo "0")
          echo "Bundle size: ${BUNDLE_SIZE}KB"
          # Warn if > 35KB gzipped threshold (rough uncompressed proxy: 100KB)
          if [ "$BUNDLE_SIZE" -gt 100 ]; then
            echo "::warning::Widget bundle may exceed 35KB gzipped target (uncompressed: ${BUNDLE_SIZE}KB)"
          fi

  # ─────────────────────────────────────────────
  # Docker Compose smoke test (all services up)
  # ─────────────────────────────────────────────
  smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [core, ai, web, widget]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cd infra
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 120
        timeout-minutes: 5

      - name: Health checks
        run: |
          curl -f http://localhost:8080/actuator/health || exit 1
          curl -f http://localhost:8001/api/v1/llm/health 2>/dev/null || echo "AI sidecar health optional"
          curl -f http://localhost:8000/health || echo "Centrifugo health optional"

      - name: Tear down
        if: always()
        run: |
          cd infra
          docker compose -f docker-compose.yml down -v
