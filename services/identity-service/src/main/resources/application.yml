spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threadly}
    username: ${DB_USER:threadly}
    password: ${DB_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: identity_service
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    baseline-on-migrate: false
    enabled: true
    locations: classpath:db/migration
    schemas: identity_service

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
    cache-names:
      - users
      - usersByEmail
      - organizations

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: identity-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        instance-id: identity-service-${random.uuid}
        service-name: identity-service
        health-check-path: /health
        health-check-interval: 10s
        port: 3001
        tags:
          - service=identity
          - version=0.1.0

server:
  port: 3001
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: true
        endpoint: http://${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}
    tracing:
      endpoint: http://${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}

logging:
  level:
    root: INFO
    dev.threadly: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# JWT Configuration
auth:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyFor256BitHMACSigningAlgorithmChangeInProduction}
    access-token-expiry-seconds: 900
    refresh-token-expiry-seconds: 2592000

# Keycloak JWT validation
keycloak:
  jwks-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/threadly/protocol/openid-connect/certs}
  base-url: ${KEYCLOAK_BASE_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:threadly}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:threadly-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:threadly-admin-secret}
