spring:
  application:
    name: knowledge-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threadly}
    username: ${DB_USER:threadly}
    password: ${DB_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: knowledge_service
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    baseline-on-migrate: false
    enabled: true
    locations: classpath:db/migration
    schemas: knowledge_service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: knowledge-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.threadly.knowledge.event"
      max-poll-records: 50

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        instance-id: knowledge-service-${random.uuid}
        service-name: knowledge-service
        health-check-path: /health
        health-check-interval: 10s
        port: 3006
        tags:
          - service=knowledge-service
          - version=0.1.0

# Qdrant Configuration
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  api-key: ${QDRANT_API_KEY:}
  timeout-seconds: 30

# Embedding Model Configuration
embedding:
  default-model: voyage-ai-3
  voyage-api-key: ${VOYAGE_API_KEY:}
  openai-api-key: ${OPENAI_API_KEY:}
  local-model-path: ${LOCAL_MODEL_PATH:}
  model-dimension: 1024
  batch-size: 32
  timeout-seconds: 60
  max-retries: 3

# Chunking Configuration
chunking:
  max-chunk-size: 1000
  min-chunk-size: 100
  overlap-size: 100
  strategy: semantic

# RAG Pipeline Configuration
rag:
  max-context-tokens: 4000
  chunk-separator: "\n---\n"

server:
  port: 3006
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: true
        endpoint: http://${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}
    tracing:
      endpoint: http://${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}

logging:
  level:
    root: INFO
    dev.threadly.knowledge: DEBUG
    org.springframework.web: INFO
    org.hibernate.sql: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/knowledge-service.log
    max-size: 10MB
    max-history: 30

# Keycloak JWT validation
keycloak:
  jwks-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/threadly/protocol/openid-connect/certs}
