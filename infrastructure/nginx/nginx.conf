user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 50m;

  # ── Rate Limiting Zones ──────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=widget:10m rate=1000r/s;

  # ── Upstream Services ────────────────────────────────────────────────
  upstream identity_service {
    server identity-service:3001;
  }

  upstream workspace_service {
    server workspace-service:3002;
  }

  upstream flow_service {
    server flow-service:3003;
  }

  upstream runtime_service {
    server runtime-service:3004;
  }

  upstream conversation_service {
    server conversation-service:3005;
  }

  upstream knowledge_service {
    server knowledge-service:3006;
  }

  upstream analytics_service {
    server analytics-service:3007;
  }

  upstream billing_service {
    server billing-service:3008;
  }

  upstream integration_service {
    server integration-service:3009;
  }

  upstream threadly_ai {
    server threadly-ai:8001;
  }

  upstream threadly_web {
    server threadly-web:3000;
  }

  # ── Proxy headers macro ──────────────────────────────────────────────
  # (applied in each location block)

  server {
    listen 8080;
    server_name _;

    # ── CORS Headers ─────────────────────────────────────────────────
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Trace-ID, X-Org-ID' always;

    # Handle preflight OPTIONS requests immediately
    if ($request_method = 'OPTIONS') {
      return 204;
    }

    # ── Health Check ─────────────────────────────────────────────────
    location = /health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # ── Auth Endpoints ───────────────────────────────────────────────
    # Two path styles are in use:
    #   /auth/*    — NextAuth server-side calls (auth.ts: /auth/login, /auth/refresh)
    #   /v1/auth/* — Client-side calls (signup page: /v1/auth/signup)
    # Both route to identity-service. /v1/auth/* is rewritten to strip /v1.
    location ~ ^/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://identity_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      rewrite ^/v1/auth/(.*)  /auth/$1  break;
      proxy_pass http://identity_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── API Keys (/v1/api-keys*) ──────────────────────────────────────
    # identity-service ApiKeyController is at /api-keys (no version prefix)
    # Rewrite: /v1/api-keys → /api-keys
    location ~ ^/v1/api-keys {
      rewrite ^/v1/api-keys(.*)  /api-keys$1  break;
      proxy_pass http://identity_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Bots & Team Members (workspace-service) ───────────────────────
    # workspace-service BotController is at /api/v1/bots
    # workspace-service TeamMemberController is at /api/v1/bots/{id}/team-members
    # Rewrite: /v1/bots → /api/v1/bots
    location ~ ^/v1/(bots|orgs|workspace|team) {
      rewrite ^/v1/(.*)  /api/v1/$1  break;
      proxy_pass http://workspace_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Flow Endpoints (flow-service) ─────────────────────────────────
    # flow-service FlowController is at /api/v1/flows
    # Rewrite: /v1/flows → /api/v1/flows
    location ~ ^/v1/flows {
      rewrite ^/v1/(.*)  /api/v1/$1  break;
      proxy_pass http://flow_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Conversations (conversation-service) ──────────────────────────
    # conversation-service ConversationController is at /api/v1/conversations
    # Rewrite: /v1/conversations → /api/v1/conversations
    location ~ ^/v1/conversations {
      rewrite ^/v1/(.*)  /api/v1/$1  break;
      proxy_pass http://conversation_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Knowledge Base (knowledge-service) ────────────────────────────
    # knowledge-service KbDocumentController is at /api/v1/kb/documents
    # Rewrite: /v1/kb → /api/v1/kb
    location ~ ^/v1/kb {
      rewrite ^/v1/(.*)  /api/v1/$1  break;
      proxy_pass http://knowledge_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Analytics & Dashboards (analytics-service) ────────────────────
    # analytics-service AnalyticsController is at /api/v1/analytics
    # analytics-service DashboardController is at /api/v1/dashboards
    # Rewrite: /v1/analytics → /api/v1/analytics, /v1/dashboards → /api/v1/dashboards
    location ~ ^/v1/(analytics|dashboards) {
      rewrite ^/v1/(.*)  /api/v1/$1  break;
      proxy_pass http://analytics_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Billing (billing-service) ─────────────────────────────────────
    location ~ ^/v1/billing {
      rewrite ^/v1/(.*)  /api/v1/$1  break;
      proxy_pass http://billing_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Integrations (integration-service) ────────────────────────────
    location ~ ^/v1/integrations {
      rewrite ^/v1/(.*)  /api/v1/$1  break;
      proxy_pass http://integration_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Runtime / Sessions / SSE (runtime-service) ────────────────────
    location ~ ^/v1/(sessions|runtime|executions) {
      limit_req zone=widget burst=50 nodelay;
      rewrite ^/v1/(.*)  /api/v1/$1  break;
      proxy_pass http://runtime_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # SSE support
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # ── AI Sidecar (internal only) ────────────────────────────────────
    location ~ ^/v1/ai/ {
      rewrite ^/v1/ai/(.*)  /$1  break;
      proxy_pass http://threadly_ai;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ── Widget CDN Endpoints ──────────────────────────────────────────
    location ~ ^/widget/ {
      limit_req zone=widget burst=100 nodelay;
      proxy_pass http://runtime_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend (Next.js) ────────────────────────────────────────────
    location / {
      proxy_pass http://threadly_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
