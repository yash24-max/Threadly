# Complete Threadly Microservices Deployments (all 9 services)
# This file contains the complete deployment for all services with proper resource limits,
# health checks, security context, and proper networking

---
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
  namespace: threadly
type: Opaque
stringData:
  postgres-url: jdbc:postgresql://postgres-service:5432/threadly
  postgres-user: threadly
  postgres-password: threadly_prod
  redis-host: redis-service
  redis-port: "6379"
  redis-password: threadly_prod
  kafka-servers: kafka-0.kafka-service.threadly.svc.cluster.local:29092,kafka-1.kafka-service.threadly.svc.cluster.local:29092,kafka-2.kafka-service.threadly.svc.cluster.local:29092
  consul-host: consul-service
  consul-port: "8500"
  jwt-private-key-path: /app/keys/private.pem
  jwt-public-key-path: /app/keys/public.pem
  centrifugo-url: http://centrifugo-service:8000
  centrifugo-api-key: dev_api_key
  threadly-ai-url: http://threadly-ai-service:8001
  qdrant-host: qdrant-service
  qdrant-port: "6333"
  minio-endpoint: http://minio-service:9000
  minio-bucket: threadly-kb
  minio-access-key: minioadmin
  minio-secret-key: minioadmin
  stripe-api-key: ""
  stripe-webhook-secret: ""
  langfuse-public-key: ""
  langfuse-secret-key: ""
  langfuse-host: ""

---
# ============================================================================
# 1. IDENTITY SERVICE (Port 3001)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: threadly
  labels:
    app: identity-service
spec:
  selector:
    app: identity-service
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: threadly
  labels:
    app: identity-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["identity-service"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: identity-service
          image: threadly/identity-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: SERVER_PORT
              value: "3001"
            - name: SPRING_APPLICATION_NAME
              value: "identity-service"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: postgres-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: postgres-password
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: "identity_service"
            - name: SPRING_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: redis-host
            - name: SPRING_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: redis-port
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: redis-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: kafka-servers
            - name: SPRING_CLOUD_CONSUL_HOST
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: consul-host
            - name: SPRING_CLOUD_CONSUL_PORT
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: consul-port
            - name: JWT_PRIVATE_KEY_PATH
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: jwt-private-key-path
            - name: JWT_PUBLIC_KEY_PATH
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: jwt-public-key-path
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

