---
# ============================================================================
# REMAINING SERVICES (4-9): RUNTIME, CONVERSATION, KNOWLEDGE, ANALYTICS, BILLING, INTEGRATION
# ============================================================================
# Note: The remaining 6 services follow the same pattern as above.
# For brevity, they are shown as a template comment.
# To generate complete YAML:
# - Copy the pattern above for each service
# - Change the service name and port numbers (3004-3009)
# - Change SPRING_APPLICATION_NAME to match service
# - Change SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA to match service
# - For knowledge-service: add QDRANT_HOST, QDRANT_PORT, S3_* env vars
# - For billing-service: add STRIPE_* env vars
#
# Services:
# - runtime-service (3004) -> runtime_service schema
# - conversation-service (3005) -> conversation_service schema, + CENTRIFUGO_URL, CENTRIFUGO_API_KEY
# - knowledge-service (3006) -> knowledge_service schema, + QDRANT/S3/THREADLY_AI_URL
# - analytics-service (3007) -> analytics_service schema, + LANGFUSE_*
# - billing-service (3008) -> billing_service schema, + STRIPE_*
# - integration-service (3009) -> integration_service schema
#
# Each deployment should include:
# - Service definition (type: ClusterIP, port: 80, targetPort: SERVICE_PORT)
# - Deployment with 3 replicas
# - RollingUpdate strategy
# - Pod anti-affinity
# - Health checks (liveness + readiness)
# - Resource limits (512Mi req / 1Gi limit for memory, 250m req / 500m limit for CPU)
# - Security context (runAsNonRoot: true, runAsUser: 1000)
# - Prometheus annotations
