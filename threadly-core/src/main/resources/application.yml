spring:
  application:
    name: threadly-core

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/threadly}
    username: ${SPRING_DATASOURCE_USERNAME:threadly}
    password: ${SPRING_DATASOURCE_PASSWORD:threadly_dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true
        format_sql: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:threadly_dev}
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 5000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  async:
    executor:
      core-pool-size: 5
      max-pool-size: 20
      queue-capacity: 100
      thread-name-prefix: threadly-async-

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      service: threadly-core
      version: "@project.version@"
  tracing:
    sampling:
      probability: 1.0

threadly:
  ai:
    url: ${THREADLY_AI_URL:http://localhost:8081}
    timeout-seconds: 30
    shared-secret: ${CORE_AI_SHARED_SECRET:dev_shared_secret}
  centrifugo:
    url: ${CENTRIFUGO_URL:http://localhost:8000}
    api-key: ${CENTRIFUGO_API_KEY:dev_api_key}
    token-secret: ${CENTRIFUGO_TOKEN_SECRET:dev_secret_change_in_prod}
    token-ttl-seconds: 3600
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/public.pem}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:900}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:threadly-kb}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}
  security:
    credential-master-key: ${CREDENTIAL_MASTER_KEY:dev_master_key_32_chars_padding__}
  rate-limit:
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:10}
    api-requests-per-org-per-minute: ${RATE_LIMIT_API_RPM:1000}

resilience4j:
  retry:
    instances:
      webhook-delivery:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
      centrifugo-publish:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      ai-service:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5

logging:
  level:
    root: INFO
    dev.threadly: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{ISO8601} [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      password: test
