spring:
  application:
    name: threadly-core

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/threadly}
    username: ${SPRING_DATASOURCE_USERNAME:threadly}
    password: ${SPRING_DATASOURCE_PASSWORD:threadly_dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:threadly_dev}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
  default-produces-media-type: application/json

threadly:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./infra/keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./infra/keys/public.pem}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30

  centrifugo:
    url: ${CENTRIFUGO_URL:http://localhost:8000}
    api-key: ${CENTRIFUGO_API_KEY:dev_api_key}
    token-secret: ${CENTRIFUGO_TOKEN_SECRET:dev_secret_change_in_prod}
    token-expiry-seconds: 3600

  ai:
    url: ${THREADLY_AI_URL:http://localhost:8081}
    shared-secret: ${CORE_AI_SHARED_SECRET:dev_shared_secret}

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:threadly-kb}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: true

  outbox:
    poll-interval-ms: 500
    batch-size: 50
    max-retry: 3

  rate-limit:
    auth-login-per-min: 10
    widget-token-per-min: 5
    ai-calls-per-min-per-org: 60
    default-per-min-per-org: 300

resilience4j:
  circuitbreaker:
    instances:
      ai-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      centrifugo:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      ai-service:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
