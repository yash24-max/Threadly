spring:
  datasource:
    # Overridden by @DynamicPropertySource in AbstractIntegrationTest
    url: jdbc:postgresql://localhost:5432/threadly_test
    username: test
    password: test
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      # Overridden by @DynamicPropertySource
      host: localhost
      port: 6379
      password: ""
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 4
          max-idle: 2

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=60s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

threadly:
  jwt:
    private-key-path: ${TEST_JWT_PRIVATE_KEY_PATH:./src/test/resources/test-private.pem}
    public-key-path: ${TEST_JWT_PUBLIC_KEY_PATH:./src/test/resources/test-public.pem}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30

  centrifugo:
    url: http://localhost:18000
    api-key: test_api_key
    token-secret: test_secret
    token-expiry-seconds: 3600

  ai:
    url: http://localhost:18081
    shared-secret: test_shared_secret

  storage:
    endpoint: http://localhost:19000
    bucket: threadly-test
    access-key: testaccess
    secret-key: testsecret
    path-style-access: true

  outbox:
    poll-interval-ms: 5000
    batch-size: 10
    max-retry: 3

  rate-limit:
    auth-login-per-min: 100
    widget-token-per-min: 100
    ai-calls-per-min-per-org: 600
    default-per-min-per-org: 3000
