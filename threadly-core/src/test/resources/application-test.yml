spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=60s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Disable rate limiting in tests
threadly:
  rate-limit:
    default-per-min-per-org: 10000
    ai-calls-per-min-per-org: 10000
  centrifugo:
    url: http://localhost:9998
    api-key: test-api-key
  ai:
    url: http://localhost:9999
    shared-secret: dev_shared_secret

# JWT — use a fixed test secret so tokens are reproducible
jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
  access-token-expiry: 3600
  refresh-token-expiry: 86400

logging:
  level:
    root: WARN
    dev.threadly: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
