version: "3.8"

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: threadly-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - threadly-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: threadly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - threadly-network

  # Threadly AI Service
  threadly-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threadly-ai
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - DEFAULT_LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379
      - CONVERSATION_SERVICE_URL=${CONVERSATION_SERVICE_URL:-http://localhost:8080}
      - CONVERSATION_API_KEY=${CONVERSATION_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - threadly-network
    volumes:
      - ./logs:/app/logs

volumes:
  qdrant_storage:
  redis_storage:

networks:
  threadly-network:
    driver: bridge
