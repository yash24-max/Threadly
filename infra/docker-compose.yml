version: "3.9"

services:
  # ── Databases ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: threadly
      POSTGRES_USER: threadly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threadly_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-threadly_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-threadly_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "ls", "/qdrant/storage"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Realtime ───────────────────────────────────────────────────────
  centrifugo:
    image: centrifugo/centrifugo:v5
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "8000:8000"   # HTTP API + WebSocket + Admin
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CENTRIFUGO_REDIS_ADDRESS: redis://:${REDIS_PASSWORD:-threadly_dev}@redis:6379
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Identity & Auth (Keycloak) ──────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: threadly
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-threadly_dev}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ── Microservices ──────────────────────────────────────────────────
  # Shared env fragment — referenced by each service via YAML anchors
  x-svc-common: &svc-common
    restart: unless-stopped
    environment: &svc-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: threadly
      DB_USER: threadly
      DB_PASSWORD: ${POSTGRES_PASSWORD:-threadly_dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/threadly/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: threadly
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-threadly-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-threadly-admin-secret}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  identity-service:
    <<: *svc-common
    build: { context: ../services/identity-service }
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  workspace-service:
    <<: *svc-common
    build: { context: ../services/workspace-service }
    ports: ["3002:3002"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  flow-service:
    <<: *svc-common
    build: { context: ../services/flow-service }
    ports: ["3003:3003"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  runtime-service:
    <<: *svc-common
    build: { context: ../services/runtime-service }
    ports: ["3004:3004"]
    environment:
      <<: *svc-env
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:-dev_api_key}
      FLOW_SERVICE_URL: http://flow-service:3003
      THREADLY_AI_URL: http://threadly-ai:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  conversation-service:
    <<: *svc-common
    build: { context: ../services/conversation-service }
    ports: ["3005:3005"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  knowledge-service:
    <<: *svc-common
    build: { context: ../services/knowledge-service }
    ports: ["3006:3006"]
    environment:
      <<: *svc-env
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-threadly-kb}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  analytics-service:
    <<: *svc-common
    build: { context: ../services/analytics-service }
    ports: ["3007:3007"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin-service:
    <<: *svc-common
    build: { context: ../services/admin-service }
    ports: ["3010:3010"]
    environment:
      <<: *svc-env
      IDENTITY_SERVICE_URL: http://identity-service:3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  threadly-ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-threadly-kb}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      CORE_SERVICE_SECRET: ${CORE_AI_SHARED_SECRET:-dev_shared_secret}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # threadly-web runs separately: cd frontend/threadly-web && pnpm dev (port 3000)

  # ── Observability ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  keycloak_data:
  grafana_data:
