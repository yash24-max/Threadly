apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: threadly
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
      name: client
    - port: 2888
      targetPort: 2888
      name: server
    - port: 3888
      targetPort: 3888
      name: leader-election

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: threadly
spec:
  serviceName: zookeeper-service
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
            - containerPort: 2888
            - containerPort: 3888
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-logs
              mountPath: /var/lib/zookeeper/log
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - echo ruok | nc localhost 2181
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - echo ruok | nc localhost 2181
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: zookeeper-logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: threadly
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 29092
      targetPort: 29092
      name: internal
    - port: 9092
      targetPort: 9092
      name: external

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-init-topics
  namespace: threadly
data:
  init-topics.sh: |
    #!/bin/bash
    kafka-topics.sh --create --topic user-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    kafka-topics.sh --create --topic org-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    kafka-topics.sh --create --topic flow-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    kafka-topics.sh --create --topic session-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    kafka-topics.sh --create --topic conversation-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    kafka-topics.sh --create --topic kb-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    kafka-topics.sh --create --topic analytics-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    kafka-topics.sh --create --topic billing-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    kafka-topics.sh --create --topic integration-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 1 --if-not-exists
    echo 'All Kafka topics created'

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: threadly
spec:
  serviceName: kafka-service
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
            - containerPort: 29092
          env:
            - name: KAFKA_BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-0.zookeeper-service.threadly.svc.cluster.local:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka-service.threadly.svc.cluster.local:29092,PLAINTEXT_HOST://$(NODE_IP):9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          livenessProbe:
            exec:
              command:
                - kafka-broker-api-versions.sh
                - --bootstrap-server=localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - kafka-broker-api-versions.sh
                - --bootstrap-server=localhost:9092
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: threadly
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.5.0
          command:
            - /bin/bash
            - -c
            - |
              sleep 30
              kafka-topics.sh --create --topic user-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              kafka-topics.sh --create --topic org-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              kafka-topics.sh --create --topic flow-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              kafka-topics.sh --create --topic session-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              kafka-topics.sh --create --topic conversation-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              kafka-topics.sh --create --topic kb-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              kafka-topics.sh --create --topic analytics-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              kafka-topics.sh --create --topic billing-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              kafka-topics.sh --create --topic integration-events --bootstrap-server kafka-0.kafka-service.threadly.svc.cluster.local:29092 --partitions 3 --replication-factor 3 --if-not-exists
              echo 'All Kafka topics created'
      restartPolicy: OnFailure
