[build]
builder = "NIXPACKS"
buildCommand = "cd threadly-ai && pip install -r requirements.txt"
watchPatterns = ["threadly-ai/**"]

[deploy]
startCommand = "cd threadly-ai && uvicorn app.main:app --host 0.0.0.0 --port 8081 --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
